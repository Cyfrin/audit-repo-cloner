name: lint-audit-issues

on:
  issues:
    types: [opened, edited, labeled, unlabeled]

permissions:
  issues: write

# Runs for the same issue are queued rather than run in parallel, so label swaps don't race
concurrency:
  group: lint-audit-issues-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        with:
          script: |
            const BAD_FORMAT_LABEL = 'BAD ISSUE FORMATTING';
            const COMMENT_MARKER = '<!-- lint-audit-issues -->';
            // An issue has at most one label from each of these groups
            const EXCLUSIVE_LABEL_PREFIXES = ['Cyfrin: ', 'Protocol: '];

            const issue_number = Number(process.env.ISSUE_NUMBER);
            const { owner, repo } = context.repo;

            // Read the current labels rather than the event's, which may be stale after a queued run swapped them
            let labels = (await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner, repo, issue_number, per_page: 100,
            })).map(l => l.name);

            // Adding a label removes the others from its group. Skip if an earlier run already
            // removed the added label, e.g. when two labels from one group were picked at once.
            const added = context.payload.action === 'labeled' ? context.payload.label.name : null;
            const prefix = added && EXCLUSIVE_LABEL_PREFIXES.find(p => added.startsWith(p));
            if (prefix && labels.includes(added)) {
              for (const name of labels.filter(n => n.startsWith(prefix) && n !== added)) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
                } catch (e) { if (e.status !== 404) throw e; }
              }
              labels = labels.filter(n => !n.startsWith(prefix) || n === added);
            }

            // Peer-reviewed findings without a protocol response get the Needs Response label, so the protocol
            // team can filter on one label. It's in the Protocol: group, so their response replaces it.
            const NEEDS_RESPONSE_LABEL = 'Protocol: Needs Response';
            const needsResponse = labels.includes('Cyfrin: Peer Reviewed')
              && !labels.some(n => n.startsWith('Protocol: ') && n !== NEEDS_RESPONSE_LABEL);
            if (needsResponse && !labels.includes(NEEDS_RESPONSE_LABEL)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [NEEDS_RESPONSE_LABEL] });
              labels.push(NEEDS_RESPONSE_LABEL);
            } else if (!needsResponse && labels.includes(NEEDS_RESPONSE_LABEL)) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: NEEDS_RESPONSE_LABEL });
              } catch (e) { if (e.status !== 404) throw e; }
              labels = labels.filter(n => n !== NEEDS_RESPONSE_LABEL);
            }

            const body = (process.env.ISSUE_BODY || '').replace(/\r\n/g, '\n');
            const lines = body.split('\n');

            const problems = [];
            let inFence = false;
            let hasDescription = false;
            for (let i = 0; i < lines.length; i++) {
              const line = lines[i];
              if (/^\s*```/.test(line)) { inFence = !inFence; continue; }
              if (inFence) continue;

              if (/\*\*Description:\*\*/.test(line)) hasDescription = true;

              // Only flag the canonical Finding template headings when they appear
              // without a trailing colon. Arbitrary bold-only lines like `**important note**`
              // are legitimate emphasis and must not be flagged.
              const TEMPLATE_HEADINGS = ['Description', 'Impact', 'Proof of Concept', 'Recommended Mitigation', 'Cyfrin'];
              const boldOnly = line.match(/^\s*\*\*([^*]+?)\*\*\s*$/);
              if (boldOnly) {
                const inner = boldOnly[1].trim();
                const innerNoColon = inner.replace(/:$/, '').trim();
                if (TEMPLATE_HEADINGS.includes(innerNoColon) && !inner.endsWith(':')) {
                  problems.push({
                    line: i + 1,
                    kind: `template heading \`**${innerNoColon}**\` missing trailing colon`,
                    text: line,
                    fix: `Finding-template headings must end with \`:\` inside the \`**\` — write \`**${innerNoColon}:**\``,
                  });
                  continue;
                }
              }

              if (/\*\*\[Project\]:\*\*/.test(line)) {
                problems.push({
                  line: i + 1,
                  kind: 'unreplaced `**[Project]:**` placeholder',
                  text: line,
                  fix: 'replace `[Project]` with the client name',
                });
                continue;
              }

              const heading = line.match(/^(\s*)(#{1,6})\s+(.+)$/);
              if (heading) {
                problems.push({
                  line: i + 1,
                  kind: 'markdown heading',
                  text: line,
                  fix: `replace with \`**${heading[3].trim()}**\``,
                });
                continue;
              }

              const html = line.match(/<\s*h[1-6][\s>]/i);
              if (html) {
                problems.push({
                  line: i + 1,
                  kind: 'HTML heading tag',
                  text: line,
                  fix: 'remove the `<hN>` tag and use `**bold**` instead',
                });
                continue;
              }

              const collapsible = line.match(/<\s*\/?\s*(details|summary)[\s>]/i);
              if (collapsible) {
                problems.push({
                  line: i + 1,
                  kind: `\`<${collapsible[1].toLowerCase()}>\` collapsible section`,
                  text: line,
                  fix: 'remove the `<details>`/`<summary>` tags — collapsible sections do not render in the PDF; promote the content to inline text with a `**bold**` label',
                });
                continue;
              }

              if (/\]\(\s*$/.test(line)) {
                problems.push({
                  line: i + 1,
                  kind: 'wrapped markdown link',
                  text: line,
                  fix: 'put the entire `[text](url)` on one line',
                });
              }

              // #NUMBER references break report generation: helpers.py rewrites them
              // into internal anchors, and a missing/external number raises KeyError.
              // Skip URL fragments (#L42 in github links) by requiring no preceding word char.
              const refs = [...line.matchAll(/(^|[^\w&\/])(#\d{1,4})(?!\w)/g)];
              for (const m of refs) {
                problems.push({
                  line: i + 1,
                  kind: `\`${m[2]}\` issue reference`,
                  text: line,
                  fix: `drop the \`#\` (e.g. write \`issue ${m[2].slice(1)}\`) or use the full URL \`https://github.com/${context.repo.owner}/${context.repo.repo}/issues/${m[2].slice(1)}\``,
                });
              }
            }

            if (!hasDescription) {
              problems.push({
                line: 0,
                kind: 'missing `**Description:**` section',
                text: '(not present in body)',
                fix: 'every issue body must contain a `**Description:**` section — add one and follow the standard finding template (Description / Impact / Proof of Concept / Recommended Mitigation)',
              });
            }

            // Report generation needs exactly one Severity: and one Cyfrin: label
            const REQUIRED_LABEL_GROUPS = [
              { prefix: 'Severity:', options: 'Critical / High / Medium / Low / Informational / Gas Optimization' },
              { prefix: 'Cyfrin:', options: 'Draft / Peer Reviewed / Resolved / Partially Resolved / Acknowledged' },
            ];
            for (const { prefix, options } of REQUIRED_LABEL_GROUPS) {
              const applied = labels.filter(n => n.startsWith(prefix + ' '));
              if (applied.length === 0) {
                problems.push({
                  line: 0,
                  kind: `missing \`${prefix}\` label`,
                  text: `(no label starting with \`${prefix}\` is applied)`,
                  fix: `apply one of the \`${prefix} <label>\` labels (${options})`,
                });
              } else if (applied.length > 1) {
                problems.push({
                  line: 0,
                  kind: `more than one \`${prefix}\` label`,
                  text: applied.join(', '),
                  fix: `keep only one \`${prefix}\` label`,
                });
              }
            }

            const existing = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const prior = existing.find(c => c.body && c.body.includes(COMMENT_MARKER));

            if (problems.length === 0) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: BAD_FORMAT_LABEL });
              } catch (e) { /* label not present; ignore */ }
              if (prior) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: prior.id });
              }
              core.info('No formatting problems found.');
              return;
            }

            const author = process.env.ISSUE_AUTHOR;
            const list = problems.map(p => {
              const loc = p.line > 0 ? `**L${p.line}**` : '**body**';
              return `- ${loc} — ${p.kind}: \`${p.text.trim()}\`\n  - ${p.fix}`;
            }).join('\n');

            const commentBody = [
              COMMENT_MARKER,
              `@${author} this issue body has formatting that breaks PDF report generation:`,
              '',
              list,
              '',
              'Headings inside an issue body leak into the report TOC. Use `**Bold**` for inline section labels instead of `#`/`##`/`###` or `<hN>`. Wrapped link URLs (`](` at end of line) won\'t render as links — keep `[text](url)` on one line. Every issue must have exactly one `Severity:` label and one `Cyfrin:` label applied.',
              '',
              `Edit the issue body to fix and the \`${BAD_FORMAT_LABEL}\` label will clear automatically.`,
            ].join('\n');

            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [BAD_FORMAT_LABEL] });

            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body: commentBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: commentBody });
            }
