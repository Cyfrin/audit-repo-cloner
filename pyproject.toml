[project]
name = "audit_repo_cloner"
version = "0.4.0"
description = "Python CLI for cloning a repo and preparing it for audit report generation."
readme = "README.md"
license = "MIT"
authors = [{ name = "Cyfrin" }]
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.5.0",
    "cryptography>=50.0.1",
    "gql[requests]>=4.0.0",
    "PyGithub>=2.10.0",
    "PyJWT>=2.13.0",
    "PyNaCl>=1.6.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/Cyfrin/audit-repo-cloner"
Repository = "https://github.com/Cyfrin/audit-repo-cloner"

[project.scripts]
audit_repo_cloner = "audit_repo_cloner:create_audit_repo"

[dependency-groups]
dev = [
    "autoflake>=2.4.0",
    "black>=26.5.1",
    "flake8>=7.3.0",
    "isort>=9.0.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 300
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 300

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
